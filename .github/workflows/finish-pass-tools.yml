name: Finish Pass Tools Tests
on:
  push:
    paths:
      - "tools/elm_policy/**"
      - "tools/elm_archive_snapshot/**"
      - ".github/workflows/finish-pass-tools.yml"
  pull_request:
    paths:
      - "tools/elm_policy/**"
      - "tools/elm_archive_snapshot/**"
      - ".github/workflows/finish-pass-tools.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python3 -m unittest discover -s tools/elm_policy/tests -v
          python3 -m unittest discover -s tools/elm_archive_snapshot/tests -v
