name: Arcade Tests
on:
  push:
    paths:
      - "tools/elm_arcade/**"
      - ".github/workflows/arcade.yml"
  pull_request:
    paths:
      - "tools/elm_arcade/**"
      - ".github/workflows/arcade.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 -m unittest discover -s tools/elm_arcade/tests -v
