name: ELM Status Tests
on:
  push:
    paths: ["tools/elm_status/**", ".github/workflows/elm-status.yml"]
  pull_request:
    paths: ["tools/elm_status/**", ".github/workflows/elm-status.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tools/elm_status/tests -v
      - run: python3 -m tools.elm_status ok
