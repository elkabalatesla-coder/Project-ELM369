name: ELM369 Repository Unit Tests

on:
  push:
    branches: [main, 'elm369/**']
    paths:
      - 'tools/**/*.py'
      - 'requirements.txt'
      - '.github/workflows/elm369-repository-tests.yml'
  pull_request:
    paths:
      - 'tools/**/*.py'
      - 'requirements.txt'
      - '.github/workflows/elm369-repository-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elm369-repository-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install project dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q tools

      - name: Run discovered tool unit tests
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          discovered=0
          for test_dir in tools/*/tests; do
            if [[ -d "$test_dir" ]] && find "$test_dir" -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
              discovered=$((discovered + 1))
              echo "::group::Unit tests: $test_dir"
              if python -m pytest -q "$test_dir"; then
                echo "PASS: $test_dir"
              else
                echo "FAIL: $test_dir"
                failures=$((failures + 1))
              fi
              echo "::endgroup::"
            fi
          done
          echo "Test directories discovered: $discovered"
          echo "Failed test directories: $failures"
          if [[ "$discovered" -eq 0 ]]; then
            echo "::error::No tool test directories were discovered."
            exit 1
          fi
          if [[ "$failures" -ne 0 ]]; then
            exit 1
          fi
