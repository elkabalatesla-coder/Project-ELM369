name: ELM369 Motion Core Tests

on:
  push:
    branches:
      - copilot/elm369-motion-matrix-qbit-core-v0-1
  pull_request:
    paths:
      - "elm369_motion_core/**"
      - ".github/workflows/elm369-motion-core-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elm369_motion_core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
