name: ELM Evolution Tests
on:
  push:
    paths:
      - "tools/elm_evolution/**"
      - ".github/workflows/elm-evolution.yml"
  pull_request:
    paths:
      - "tools/elm_evolution/**"
      - ".github/workflows/elm-evolution.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run evolution tests
        run: python3 -m unittest discover -s tools/elm_evolution/tests -v
