name: ELM369 Adaptive Keyboard Policy Tests

on:
  pull_request:
    paths:
      - "elm369_adaptive_keyboard/**"
      - ".github/workflows/adaptive-keyboard-tests.yml"
  push:
    branches:
      - "copilot/elm369-motion-matrix-qbit-core-v0-1"
    paths:
      - "elm369_adaptive_keyboard/**"
      - ".github/workflows/adaptive-keyboard-tests.yml"

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile package
        run: python -m compileall -q elm369_adaptive_keyboard
      - name: Run API, policy, and service tests
        run: python -m unittest -v elm369_adaptive_keyboard.test_api elm369_adaptive_keyboard.test_policy_gate elm369_adaptive_keyboard.test_service
