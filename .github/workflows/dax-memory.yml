name: DAX Memory Tests

on:
  push:
    paths:
      - 'tools/dax_memory/**'
      - 'schemas/memory/**'
      - '.github/workflows/dax-memory.yml'
  pull_request:
    paths:
      - 'tools/dax_memory/**'
      - 'schemas/memory/**'
      - '.github/workflows/dax-memory.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Unit tests
        run: python -m unittest discover -s tools/dax_memory/tests -v
