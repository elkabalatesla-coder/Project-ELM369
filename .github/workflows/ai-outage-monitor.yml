name: AI Outage Monitor Tests

on:
  push:
    paths:
      - 'tools/ai_outage_monitor/**'
      - '.github/workflows/ai-outage-monitor.yml'
  pull_request:
    paths:
      - 'tools/ai_outage_monitor/**'
      - '.github/workflows/ai-outage-monitor.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Unit tests
        run: python -m unittest discover -s tools/ai_outage_monitor/tests -v
