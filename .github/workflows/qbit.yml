name: QBIT Tests

on:
  push:
    paths:
      - 'tools/qbit/**'
      - 'schemas/qbit/**'
      - '.github/workflows/qbit.yml'
  pull_request:
    paths:
      - 'tools/qbit/**'
      - 'schemas/qbit/**'
      - '.github/workflows/qbit.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Unit tests
        run: python -m unittest discover -s tools/qbit/tests -v
