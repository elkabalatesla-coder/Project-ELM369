name: Project ELM369 CI

on:
  push:
    branches:
      - main
      - elm369-observable-architecture-integration
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elm369-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install runtime and pinned CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-ci.txt

      - name: Validate OpenAPI 3.1 contract
        run: python -m openapi_spec_validator docs/openapi/elm369-openapi.yaml

      - name: Run test suite with branch coverage gate
        run: |
          python -m pytest -v \
            --cov \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80

      - name: Upload HTML and XML coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
          if-no-files-found: warn
          retention-days: 14
