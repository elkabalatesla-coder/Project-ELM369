name: ELM Daily Automation Tests

on:
  push:
    paths:
      - 'tools/elm_daily_automation/**'
      - 'tools/ai_outage_monitor/**'
      - '.github/workflows/elm-daily-automation.yml'
  pull_request:
    paths:
      - 'tools/elm_daily_automation/**'
      - 'tools/ai_outage_monitor/**'
      - '.github/workflows/elm-daily-automation.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Unit tests
        run: python -m unittest discover -s tools/elm_daily_automation/tests -v
