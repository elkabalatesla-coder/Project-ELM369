[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-elm369"
version = "0.0.1"
description = "Project-ELM369 Python tooling and runtime helpers"
requires-python = ">=3.8"
dependencies = [
  "requests>=2.32.0,<3.0.0",
  "pydantic>=2.0,<3.0",
  "fastapi>=0.115.14,<0.116.0",
  "uvicorn>=0.30.6,<0.31.0",
  "backports.zoneinfo>=0.2 ; python_version < '3.9'",
]

[project.optional-dependencies]
test = ["httpx>=0.28.1,<1.0.0"]
